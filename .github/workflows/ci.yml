name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Contact integrity guard
        run: npm run guard
      - name: Lint
        run: npm run lint
      - name: Build (termasuk typecheck)
        run: npx next build
